<!DOCTYPE html>
<html>
<head>
  <title>FlowWall Web Tracker</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .header h3 {
      margin: 0;
      font-size: 14px;
      color: #333;
    }
    .status {
      font-size: 12px;
      color: #666;
    }
    .status.online {
      color: #10b981;
    }
    .status.offline {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="width: 16px; height: 16px; background: linear-gradient(135deg, #60A5FA, #8B5CF6); border-radius: 4px;"></div>
    <h3>FlowWall Tracker</h3>
  </div>
  <div class="status online">✓ 正在追踪</div>
  <p style="font-size: 11px; color: #999; margin-top: 10px;">
    网站浏览数据正在同步到 FlowWall
  </p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a73e8;
    }
    .status {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 16px;
    }
    .status.connected {
      color: #137333;
    }
    .status.disconnected {
      color: #d93026;
    }
    .stats {
      font-size: 12px;
      line-height: 1.6;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stat-label {
      color: #5f6368;
    }
    .stat-value {
      color: #202124;
      font-weight: 500;
    }
    .button {
      width: 100%;
      padding: 8px 12px;
      margin-top: 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .button:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>
  <div class="title">FlowWall Web Tracker</div>
  <div id="status" class="status disconnected">未连接</div>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">当前网站</span>
      <span id="currentDomain" class="stat-value">-</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">浏览时长</span>
      <span id="currentDuration" class="stat-value">-</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">打开标签</span>
      <span id="totalTabs" class="stat-value">-</span>
    </div>
  </div>
  <button id="refreshBtn" class="button">刷新状态</button>
  <script src="popup.js"></script>
</body>
</html>
